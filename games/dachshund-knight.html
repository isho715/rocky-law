<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>臘腸狗騎士</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;700;900&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed game canvas; HTML overlays for menus; two ear controls pinned to the bottom corners (mirrored at the top for player 2). One committed sunny-cartoon look. */
:root{
  --fur:#a8572a; --fur-dk:#6e3415; --cream:#f6ead2; --paper:#fffaf0; --ink:#2b1d14; --muted:#7b6656;
  --grass:#6fae4b; --sky:#9fd3ef; --accent:#e8442e; --p2:#2f6fd6; --line:#e2cfae; --gold:#f2b632;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;margin:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0;display:block;width:100%;height:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---- overlays ---- */
.ov{position:fixed;inset:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  background:rgba(43,29,20,.35);padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;touch-action:pan-y}
.sheet{background:var(--paper);border-radius:18px;width:100%;max-width:440px;margin:auto 0;padding:20px 18px 18px;box-sizing:border-box;
  box-shadow:0 14px 40px rgba(43,29,20,.3);display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand canvas{width:96px;height:56px;flex:none}
h1{font-family:var(--f-display);font-size:2.1rem;line-height:1.05;margin:0;letter-spacing:.04em}
h1 small{display:block;font-family:var(--f-body);font-size:.78rem;font-weight:400;color:var(--muted);letter-spacing:.02em;margin-top:4px}
h2{font-family:var(--f-display);font-size:1.5rem;margin:0;text-wrap:balance}
.how{background:var(--cream);border-radius:12px;padding:10px 12px;font-size:.88rem;line-height:1.6;display:grid;gap:4px}
.how b{color:var(--fur-dk)}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:44px 1fr;gap:2px 12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;
  border-radius:14px;padding:12px;cursor:pointer}
.mode:active{transform:scale(.98)}
.mode .ic{grid-row:1/3;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem;color:#fff;background:var(--fur)}
.mode b{font-size:1.05rem}
.mode span{font-size:.8rem;color:var(--muted)}
.mode.vs .ic{background:var(--p2)} .mode.board .ic{background:var(--gold);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.back{border:0;background:none;color:var(--muted);font-size:.9rem;cursor:pointer;padding:4px 0}
.tracks{display:grid;gap:10px}
.track{position:relative;overflow:hidden;border:2px solid var(--line);border-radius:14px;cursor:pointer;padding:0;background:#fff;text-align:left}
.track canvas{display:block;width:100%;height:84px}
.track .meta{padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.track .meta b{font-size:1.1rem}
.track .meta span{font-size:.8rem;color:var(--muted)}
.track .tag{position:absolute;top:8px;left:8px;background:rgba(255,250,240,.92);border-radius:999px;font-size:.72rem;padding:2px 8px;font-weight:700}
.tag.hard{color:var(--accent)} .tag.easy{color:#3f7d27}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:13px;font-weight:900;font-size:1.05rem;cursor:pointer;letter-spacing:.08em;background:var(--ink);color:#fff;width:100%}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.results{display:grid;gap:6px}
.res{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.res.me{border-color:var(--accent);background:#fff3ee}
.res .pl{font-family:var(--f-display);font-size:1.3rem;text-align:center}
.res .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .nm small{color:var(--muted);font-size:.75rem;margin-left:4px}
.note{font-size:.8rem;color:var(--muted);line-height:1.5;margin:0}
.note.warn{color:var(--accent)}

/* ---- in-race controls ---- */
.hudbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);z-index:5;
  border:0;background:rgba(255,250,240,.85);border-radius:10px;padding:6px 10px;font-size:.8rem;font-weight:700;cursor:pointer}
.ctl{position:fixed;left:0;right:0;bottom:0;height:0;z-index:4;pointer-events:none}
.ctl.p2{top:0;bottom:auto;transform:rotate(180deg)}
.paw,.jump{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;cursor:pointer}
/* 右下的狗掌：按住就是油門，外圈顯示油門大小；連按三下噴射 */
.paw{width:156px;height:156px;right:calc(max(14px,env(safe-area-inset-right,0px)));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  background:conic-gradient(var(--ring) calc(var(--t,0) * 1turn),rgba(255,250,240,.55) 0);--ring:#f2b632}
.paw .face{position:absolute;inset:9px;border-radius:50%;background:rgba(255,250,240,.92);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line);transition:transform .06s}
.paw.on .face{transform:scale(.92);background:#ffe9b8}
.paw.boost{--ring:#ff6a2b;box-shadow:0 0 0 4px rgba(255,106,43,.45),0 0 26px rgba(255,106,43,.85)}
.paw.boost .face{background:#ffd2b0}
.paw svg{width:78%;height:78%}
.paw .taps{position:absolute;top:-2px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.paw .taps i{width:11px;height:11px;border-radius:50%;background:rgba(43,29,20,.25);box-shadow:0 0 0 2px rgba(255,250,240,.9)}
.paw .taps i.on{background:#ff6a2b}
.paw .lbl,.jump .lbl{position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;font-size:.68rem;font-weight:900;background:var(--ink);color:#fff;border-radius:999px;padding:1px 8px;white-space:nowrap}
.jump{width:92px;height:92px;left:calc(max(14px,env(safe-area-inset-left,0px)));bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  background:rgba(255,250,240,.88);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center}
.jump svg{width:62%;height:62%}
.jump.on{background:var(--gold)}
.ctl.p2 .paw{--ring:#7fb0ff}
.ctl.p2 .paw .lbl,.ctl.p2 .jump .lbl{background:var(--p2)}
.ctl.p1.duo .paw .lbl,.ctl.p1.duo .jump .lbl{background:var(--accent)}
.tag.mid{color:#b8741a}

/* ---- 選狗狗 ---- */
.dogprev{display:block;width:100%;height:150px;border-radius:14px;background:var(--cream)}
.opt{display:grid;gap:6px}
.opt>b{font-size:.9rem;color:var(--fur-dk)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pickc{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pickc[aria-pressed="true"]{border-color:var(--ink);background:var(--cream);font-weight:700}
.pickc .sw{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.namein{border:2px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:#fff;width:100%;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){.mode:active{transform:none}}
</style>
</head>
<body>
<!-- 這是雲端資料夾裡的離線版：可以跟電腦比賽、兩人同機對戰；線上排行榜只在 claude.ai 的版本裡能用。
     第三版：狗掌油門、連按三下噴射、選狗狗（毛色／長短毛／配件）、十條路線。 -->
<canvas id="game"></canvas>

<button class="hudbtn" id="quitBtn" type="button" hidden>離開</button>

<div class="ctl p1" id="ctl1" hidden>
  <div class="jump" id="jump1" aria-label="跳"><svg viewBox="0 0 60 60"><path d="M30 6c-9 0-15 8-15 18 0 14 9 28 15 30 6-2 15-16 15-30 0-10-6-18-15-18z" fill="#8a4520"/><path d="M30 14c-5 0-8 5-8 11 0 9 5 18 8 20 3-2 8-11 8-20 0-6-3-11-8-11z" fill="#c9875a"/></svg><span class="lbl">點一下：跳</span></div>
  <div class="paw" id="paw1" aria-label="油門（狗掌）"><span class="taps"><i></i><i></i><i></i></span><div class="face"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="56" rx="40" ry="36" fill="#a8572a"/><path d="M50 50c-12 0-22 9-22 19 0 8 7 12 14 11 4 0 6-2 8-2s4 2 8 2c7 1 14-3 14-11 0-10-10-19-22-19z" fill="#f4a6a0"/><ellipse cx="26" cy="40" rx="8" ry="10" transform="rotate(-25 26 40)" fill="#f4a6a0"/><ellipse cx="41" cy="30" rx="8" ry="10.5" transform="rotate(-8 41 30)" fill="#f4a6a0"/><ellipse cx="59" cy="30" rx="8" ry="10.5" transform="rotate(8 59 30)" fill="#f4a6a0"/><ellipse cx="74" cy="40" rx="8" ry="10" transform="rotate(25 74 40)" fill="#f4a6a0"/></svg></div><span class="lbl">按住跑・連按三下噴射</span></div>
</div>
<div class="ctl p2" id="ctl2" hidden>
  <div class="jump" id="jump2" aria-label="玩家二跳"><svg viewBox="0 0 60 60"><path d="M30 6c-9 0-15 8-15 18 0 14 9 28 15 30 6-2 15-16 15-30 0-10-6-18-15-18z" fill="#3a2a22"/><path d="M30 14c-5 0-8 5-8 11 0 9 5 18 8 20 3-2 8-11 8-20 0-6-3-11-8-11z" fill="#b07a4a"/></svg><span class="lbl">點一下：跳</span></div>
  <div class="paw" id="paw2" aria-label="玩家二油門（狗掌）"><span class="taps"><i></i><i></i><i></i></span><div class="face"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="56" rx="40" ry="36" fill="#3a2a22"/><path d="M50 50c-12 0-22 9-22 19 0 8 7 12 14 11 4 0 6-2 8-2s4 2 8 2c7 1 14-3 14-11 0-10-10-19-22-19z" fill="#e8a0a8"/><ellipse cx="26" cy="40" rx="8" ry="10" transform="rotate(-25 26 40)" fill="#e8a0a8"/><ellipse cx="41" cy="30" rx="8" ry="10.5" transform="rotate(-8 41 30)" fill="#e8a0a8"/><ellipse cx="59" cy="30" rx="8" ry="10.5" transform="rotate(8 59 30)" fill="#e8a0a8"/><ellipse cx="74" cy="40" rx="8" ry="10" transform="rotate(25 74 40)" fill="#e8a0a8"/></svg></div><span class="lbl">按住跑・連按三下噴射</span></div>
</div>

<div class="ov" id="dogs" hidden>
  <div class="sheet">
    <button class="back" type="button" id="dogBack" hidden>← 回主選單</button>
    <h2 id="dogTitle">第一步：選你的臘腸狗</h2>
    <canvas class="dogprev" id="dogPrev"></canvas>
    <div class="opt"><b>毛色</b><div class="chips" id="optCoat"></div></div>
    <div class="opt"><b>毛的長短</b><div class="chips" id="optHair"></div></div>
    <div class="opt"><b>配件</b><div class="chips" id="optAcc"></div></div>
    <label class="opt"><b>狗狗的名字</b><input class="namein" id="dogName" maxlength="8" autocomplete="off"></label>
    <button class="btn" type="button" id="dogGo">下一步：選比賽模式</button>
  </div>
</div>

<div class="ov" id="home" hidden>
  <div class="sheet">
    <div class="brand"><canvas id="logo" width="192" height="112"></canvas>
      <h1>臘腸狗騎士<small>騎著臘腸狗衝過十種地形，按狗掌就是催油門</small></h1></div>
    <div class="how">
      <div><b>右下的狗掌</b>：按住就是油門，放開就慢下來。</div>
      <div><b>連按狗掌三下</b>：噴射衝刺！速度大增，但體力消耗得很快。</div>
      <div><b>左下的耳朵</b>：點一下就跳。</div>
      <div><b>飛在空中</b>：按住狗掌狗頭會抬起來，按住耳朵狗頭往下壓，用來調整落地角度。</div>
      <div><b>體力</b>：一直全速會喘，喘的時候跑不快，也不能噴射。路上的骨頭可以補體力。</div>
      <div><b>翻肚</b>：不會出局，狗狗會在原地翻回來繼續跑，只是會耽誤一點時間。</div>
    </div>
    <div class="modes">
      <button class="mode" type="button" id="mAI"><span class="ic">賽</span><b>跟電腦比賽</b><span>和三隻電腦臘腸狗同場，還有你最佳紀錄的影子狗陪跑</span></button>
      <button class="mode vs" type="button" id="mDuo"><span class="ic">雙</span><b>兩人同機對戰</b><span>手機平放，兩個人各拿一頭，上下半畫面各騎一隻</span></button>
    </div>
    <div class="row"><button class="chip" type="button" id="dogBtn">換狗狗</button><button class="chip" type="button" id="muteBtn">聲音：開</button></div>
    <p class="note">電腦可用鍵盤：→ 油門（快按三下噴射）　← 煞車／空中低頭　空白鍵 跳</p>
  </div>
</div>

<div class="ov" id="pick" hidden>
  <div class="sheet">
    <button class="back" type="button" id="pickBack">← 回主選單</button>
    <h2 id="pickTitle">選路線</h2>
    <div class="tracks" id="trackList"></div>
  </div>
</div>

<div class="ov" id="result" hidden>
  <div class="sheet">
    <h2 id="resTitle">比賽結果</h2>
    <div class="results" id="resList"></div>
    <p class="note" id="resNote"></p>
    <div class="btns"><button class="btn" type="button" id="againBtn">再比一次</button><button class="btn alt" type="button" id="menuBtn">換路線</button></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const wrap=a=>{a=(a+Math.PI)%(2*Math.PI);if(a<0)a+=2*Math.PI;return a-Math.PI;};
const bump=(x,c,w,h)=>{const d=(x-c)/w;return Math.abs(d)<1?h*0.5*(1+Math.cos(Math.PI*d)):0;};
const ramp=(x,s,len,h,drop)=>x<s||x>s+len+drop?0:x<s+len?h*sm((x-s)/len):h*(1-sm((x-s-len)/drop));
const fmt=t=>{if(t==null||!isFinite(t))return '--:--.--';const m=Math.floor(t/60),s=t-m*60;return `${m}:${s<10?'0':''}${s.toFixed(2)}`;};
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

// ===== 路線（想加新路線就照這個格式加一個） =====
const TRACKS={
  park:{id:'park',name:'公園草地',len:500,diff:'簡單',hard:false,
    desc:'緩緩的小山坡，一個小跳台，適合熟悉手感',
    h:x=>{const e=sm((x-15)/40);
      return e*(2.2*Math.sin(x/19)+1.0*Math.sin(x/7.3+1.3))+bump(x,140,10,1.2)+bump(x,156,10,1.4)+ramp(x,262,22,3.6,12)+bump(x,385,26,5)+bump(x,450,12,1.5);},
    sky:['#8fd0f2','#e9f7fb'],far:'#a9d8a0',mid:'#86c06a',ground:'#7a5a3a',top:'#6fae4b',topDk:'#4f8a35',deco:'tree',sun:'rgba(255,240,170,.9)'},
  mountain:{id:'mountain',name:'山路',len:800,diff:'困難',hard:true,
    desc:'大上坡、大下坡和一個飛越山谷的跳台，速度要控制',
    h:x=>{const e=sm((x-15)/50);
      return e*(7*Math.sin(x/55)+3*Math.sin(x/17+0.7)+0.55*Math.sin(x/4.1))+0.02*Math.max(0,x-15)
        +ramp(x,330,26,3.2,6)-bump(x,382,28,8)+bump(x,565,40,9)-bump(x,650,30,4)+bump(x,725,14,2.2);},
    sky:['#f6b98a','#fde8cf'],far:'#c79a86',mid:'#9b7a6a',ground:'#6b5446',top:'#8f8a62',topDk:'#6e6a48',deco:'pine',peaks:'#d9b2a0',sun:'rgba(255,214,150,.95)'},
  // ---- 第三版新增的八條路線 ----
  beach:{id:'beach',name:'海灘',len:600,diff:'普通',
    desc:'沙灘比較吃力，兩個救生員跳台，可以飛過浪花',roll:0.2,
    h:x=>{const e=sm((x-15)/40);
      return e*(1.6*Math.sin(x/23)+0.6*Math.sin(x/9+0.4))+ramp(x,180,20,3,10)+bump(x,300,30,3)+ramp(x,420,18,3.4,10)+bump(x,520,14,1.2);},
    sky:['#7ec8f0','#fdf3d8'],far:'#3f9ad3',mid:'#7cc7ea',farAmp:0.12,midAmp:0.2,ground:'#d9b97a',top:'#f0d89a',topDk:'#c9a96a',deco:'palm',bg:'sea',sun:'rgba(255,236,150,.95)'},
  snow:{id:'snow',name:'雪地',len:700,diff:'普通',
    desc:'雪很滑，抓地力比較差，下坡記得放開狗掌',mu:0.72,
    h:x=>{const e=sm((x-15)/45);
      return e*(4*Math.sin(x/40)+1.5*Math.sin(x/15+1))+ramp(x,250,24,3.4,10)+bump(x,400,40,6)-bump(x,470,25,3)+ramp(x,600,20,3,10);},
    sky:['#b9d6ea','#f4f8fb'],far:'#d6e4ef',mid:'#bfd2e2',ground:'#9fb4c4',top:'#ffffff',topDk:'#c9dbe8',deco:'snow',peaks:'#eef4f9',sun:'rgba(255,250,225,.95)'},
  city:{id:'city',name:'城市街道',len:650,diff:'普通',
    desc:'平平的馬路上有好幾個斜坡跳台，還有一座拱橋',
    h:x=>{const e=sm((x-15)/40);
      return e*0.4*Math.sin(x/30)+ramp(x,120,14,2.4,6)+ramp(x,230,18,3,8)+bump(x,340,35,4)+ramp(x,450,14,2.8,6)+ramp(x,520,20,3.6,10)+bump(x,600,10,1);},
    sky:['#a8c8e8','#f3e9da'],far:null,mid:null,ground:'#55585e',top:'#3a3d42',topDk:'#f2d04a',dash:true,deco:'city',bg:'skyline',sun:'rgba(255,240,190,.9)'},
  desert:{id:'desert',name:'沙漠',len:750,diff:'普通',
    desc:'一個接一個的大沙丘，沙子很吃力，骨頭比較少',roll:0.13,boneGap:70,
    h:x=>{const e=sm((x-15)/45);
      return e*(5*Math.sin(x/48)+1.2*Math.sin(x/13+2))+bump(x,300,30,5)+ramp(x,460,24,3.8,12)+bump(x,620,45,7);},
    sky:['#ffcf8a','#fff1d6'],far:'#f0c08a',mid:'#e2a868',ground:'#c98a4b',top:'#e8b26a',topDk:'#c48a48',deco:'cactus',peaks:'#f0cb93',sun:'rgba(255,250,200,1)'},
  forest:{id:'forest',name:'森林小徑',len:700,diff:'普通',
    desc:'路上有樹根和倒下的木頭，顛顛的，小心翻肚',
    h:x=>{const e=sm((x-15)/40);

const DIFF_TAG={'簡單':'easy','普通':'mid','困難':'hard'};
const slopeOf=(T,x)=>(T.h(x+0.05)-T.h(x-0.05))/0.1;

// ===== 物理參數 =====
const G=9.8, RW=0.3, K=260, C=20, MU=1.05, DRIVE=13, BRAKE=14, AIRTQ=6.5, INERT=0.32;
const WHEELS=[[-0.75,-0.35],[0.75,-0.35]];
const HEAD=[-0.02,1.05], BACK=[0,0.3];
const VMAX=17, VMAX_TIRED=7.5;
// 噴射：往狗狗面向的方向推，持續 BOOST_T 秒；開噴先扣一口體力，噴的時候體力掉得很快
const BOOST=10, BOOST_T=1.4, BOOST_COST=0.12, BOOST_DRAIN=0.24;
function makeRacer(o){
  return Object.assign({x:3,y:0,vx:0,vy:0,a:0,om:0,thr:0,jump:false,jumpCd:0,onGround:false,stam:1,panting:false,
    state:'race',crashT:0,boostT:0,boosts:0,cp:0,finish:null,bones:new Set(),phase:0,bend:0,crashes:0,ear:0},o);
}
function placeAt(r,T,x){
  r.x=x; const sl=slopeOf(T,x); r.a=Math.atan(sl); r.y=T.h(x)+0.35/Math.cos(r.a)+RW+0.02;
  r.vx=r.vy=r.om=0;
}
function stepRacer(r,T,dt,raceT){
  if(r.jumpCd>0) r.jumpCd-=dt;
  if(r.state==='crash'){r.crashT-=dt; if(r.crashT<=0){placeAt(r,T,Math.max(3,r.x)); r.state=r.finish!=null?'done':'race'; r.stam=Math.max(r.stam,0.4); r.panting=false;} return;}
  const thr=r.state==='done'?-0.4:r.thr;
  const c=Math.cos(r.a), s=Math.sin(r.a);
  const g=T.g||G, mu=T.mu||MU, roll=T.roll||0.12;
  let fx=0, fy=-g, tq=0, contacts=0, gnx=0, gny=0;
  const vmax=r.panting?VMAX_TIRED:VMAX;
  for(const [ox,oy] of WHEELS){
    const rx=ox*c-oy*s, ry=ox*s+oy*c, wx=r.x+rx, wy=r.y+ry;
    const h=T.h(wx), sl=slopeOf(T,wx), nl=Math.hypot(1,sl), nx=-sl/nl, ny=1/nl, tx=1/nl, ty=sl/nl;
    const pen=(h-(wy-RW))*ny;
    if(pen>0){
      contacts++; gnx+=nx; gny+=ny;
      const vx=r.vx-r.om*ry, vy=r.vy+r.om*rx, vn=vx*nx+vy*ny, vt=vx*tx+vy*ty;
      const N=Math.max(0,K*pen-C*vn);
      let Ft=thr>=0?thr*DRIVE*0.5*Math.max(0,1-vt/vmax):-Math.sign(vt)*Math.min(-thr*BRAKE*0.5,Math.abs(vt)*8);
      Ft-=vt*roll;
      const lim=mu*N; Ft=clamp(Ft,-lim,lim);
      const Fx=nx*N+tx*Ft, Fy=ny*N+ty*Ft;
      fx+=Fx; fy+=Fy; tq+=rx*Fy-ry*Fx;
      if(pen>0.22){r.x+=nx*(pen-0.22);r.y+=ny*(pen-0.22);}
    }
  }
  if(contacts===0) tq+=thr*AIRTQ;
  if(r.jump && contacts>0 && r.jumpCd<=0 && r.state==='race'){
    const l=Math.hypot(gnx,gny)||1; r.vx+=gnx/l*5.2; r.vy+=gny/l*5.2; r.jumpCd=0.6; sfx.jump(r);
  }
  r.jump=false;
  if(r.boostT>0){
    r.boostT-=dt; fx+=c*BOOST; fy+=s*BOOST; r.stam-=BOOST_DRAIN*dt;
    if(r.stam<=0||r.state!=='race') r.boostT=0;
  }
  const sp=Math.hypot(r.vx,r.vy);
  fx-=0.004*r.vx*sp; fy-=0.004*r.vy*sp;
  r.vx+=fx*dt; r.vy+=fy*dt; r.om+=tq/INERT*dt; r.om*=1-(contacts?1.5:0.4)*dt;
  r.x+=r.vx*dt; r.y+=r.vy*dt; r.a+=r.om*dt;
  r.onGround=contacts>0;
  if(r.state==='race'){
    if(thr>0.05) r.stam-=0.062*thr*dt; else r.stam+=(r.panting?0.2:0.13)*dt;
    r.stam=clamp(r.stam,0,1);
    if(r.stam<=0 && !r.panting){r.panting=true; if(r.human) flashMsg(r,'喘不過氣了！先放慢一點');}
    if(r.panting && r.stam>0.35) r.panting=false;
  }
  r.phase+=Math.abs(r.vx)*dt*4.2*(contacts?1:0.2);
  const groundMid=T.h(r.x), wheelAvg=(T.h(r.x-0.75*c)+T.h(r.x+0.75*c))/2;
  const targetBend=r.onGround?clamp((groundMid-wheelAvg)*0.9,-0.22,0.22):clamp(-r.vy*0.012,-0.12,0.12);
  r.bend+=(targetBend-r.bend)*Math.min(1,dt*10);
  for(const b of T.bones){ if(!r.bones.has(b.x) && Math.abs(b.x-r.x)<1.1 && Math.abs(b.y-(r.y+0.3))<1.3){r.bones.add(b.x); r.stam=Math.min(1,r.stam+0.35); if(r.panting&&r.stam>0.35)r.panting=false; if(r.human){sfx.bone();flashMsg(r,'吃到骨頭，體力回復！');}}}
  const cp=Math.floor(r.x/100)*100; if(cp>r.cp && r.onGround) r.cp=cp;
  for(const [ox,oy,rad] of [[HEAD[0],HEAD[1],0.16],[BACK[0],BACK[1],0.05],[1.05,0.3,0.05]]){
    const px=r.x+ox*c-oy*s, py=r.y+ox*s+oy*c;
    if(py-rad<T.h(px)){crash(r); return;}
  }
  if(r.state==='race' && r.x>=T.len){r.state='done'; r.finish=raceT; if(r.human) sfx.finish();}
  if(r.y<-60) crash(r);
}
function crash(r){
  r.state='crash'; r.crashT=0.8; r.crashes++; r.vx=r.vy=0; r.om=0; r.boostT=0;
  if(r.human){sfx.yelp(); flashMsg(r,'翻肚了！爬起來繼續跑');}
}
function tryBoost(r){
  if(r.state!=='race'||r.boostT>0) return;
  if(r.panting||r.stam<BOOST_COST+0.03){ if(r.human) flashMsg(r,'體力不夠，噴不動了！'); return; }
  r.boostT=BOOST_T; r.stam-=BOOST_COST; r.boosts++;
  if(r.human){sfx.boost(); flashMsg(r,'噴射！');}
}
function aiInput(r,T){
  if(r.state!=='race'){r.thr=0;return;}
  if(r.onGround){
    let t=r.skill;
    const sl=slopeOf(T,r.x+1.5), ahead=slopeOf(T,r.x+6);
    if(sl<-0.28) t=Math.min(t,0.3);
    if(ahead<-0.5 && r.vx>11) t=-0.3;
    if(r.stam<0.25 && !r.panting) t=Math.min(t,0.5);
    if(r.panting) t=Math.min(t,0.6);
    if(r.boostT<=0 && !r.panting && r.stam>0.8 && r.vx>6 && r.vx<15 && Math.random()<0.0015*r.skill){
      let calm=true; for(let k=3;k<=34;k+=1.5){const q=slopeOf(T,r.x+k); if(q>0.32||q<-0.22){calm=false;break;}}
      if(calm) tryBoost(r);
    }
    r.thr=t+(Math.sin(performance.now()/700+r.seed)*0.05);
  } else {
    const desired=Math.atan(slopeOf(T,r.x+Math.max(1,r.vx*0.35)));
    const err=wrap(r.a-desired);
    r.thr=clamp(-err*2.6-r.om*0.7,-1,1);
  }
}
function rng(seed){return ()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}
for(const T of Object.values(TRACKS)){
  const R=rng(T.len*7+3);
  T.bones=[]; const gap=T.boneGap||55; for(let x=70;x<T.len-20;x+=gap+R()*25){T.bones.push({x,y:T.h(x)+1.1});}
  T.decos=[]; for(let x=-30;x<T.len+80;x+=4+R()*9){T.decos.push({x,s:0.7+R()*0.8,k:R()});}
}

// ===== 操作：右邊狗掌（按住＝油門、連按三下＝噴射），左邊耳朵（跳；空中按住＝低頭） =====
const TAP_WIN=650;
const players=[0,1].map(i=>({i,thr:0,keyGas:false,keyBrake:false,jumpQ:false,boostQ:false,pawDown:false,earDown:false,air:false,taps:[],
  paw:$('paw'+(i+1)),dots:[...$('paw'+(i+1)).querySelectorAll('.taps i')],jumpEl:$('jump'+(i+1)),ptr:null}));
function pawTap(P){
  const now=performance.now(); P.taps=P.taps.filter(t=>now-t<TAP_WIN); P.taps.push(now);
  if(P.taps.length>=3){P.taps=[];P.boostQ=true;}
}
for(const P of players){
  const d=P.paw;
  d.addEventListener('pointerdown',e=>{e.preventDefault();audio.init();P.ptr=e.pointerId;P.pawDown=true;d.classList.add('on');pawTap(P);try{d.setPointerCapture(e.pointerId);}catch(_){}});
  const up=e=>{if(e.pointerId!==P.ptr)return;P.ptr=null;P.pawDown=false;d.classList.remove('on');};
  d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up);d.addEventListener('lostpointercapture',up);
  const j=P.jumpEl;
  j.addEventListener('pointerdown',e=>{e.preventDefault();audio.init();P.jumpQ=true;P.earDown=P.air;j.classList.add('on');});
  const jup=()=>{P.earDown=false;j.classList.remove('on');};
  j.addEventListener('pointerup',jup);j.addEventListener('pointercancel',jup);j.addEventListener('pointerleave',jup);
  for(const el of [d,j]) el.addEventListener('contextmenu',e=>e.preventDefault());
}
const KEYS={ArrowRight:[0,'gas'],ArrowUp:[0,'gas'],ArrowLeft:[0,'brake'],ArrowDown:[0,'brake'],' ':[0,'jump'],
  d:[1,'gas'],D:[1,'gas'],a:[1,'brake'],A:[1,'brake'],w:[1,'jump'],W:[1,'jump']};
addEventListener('keydown',e=>{
  const k=KEYS[e.key]; if(!k||!race) return; e.preventDefault(); audio.init();
  if(mode!=='duo'&&k[0]===1) return; const P=players[mode==='duo'?k[0]:0];
  if(k[1]==='gas'){P.keyGas=true; if(!e.repeat) pawTap(P);} else if(k[1]==='brake')P.keyBrake=true; else if(!e.repeat) P.jumpQ=true;
});
addEventListener('keyup',e=>{const k=KEYS[e.key]; if(!k)return; const P=players[mode==='duo'?k[0]:0]; if(k[1]==='gas')P.keyGas=false; if(k[1]==='brake')P.keyBrake=false;});
addEventListener('blur',()=>players.forEach(P=>{P.keyGas=P.keyBrake=false;}));
function readPlayer(P,dt,r){
  let tgt=0;
  if(P.pawDown||P.keyGas) tgt=1; else if(P.keyBrake||(P.earDown&&P.air)) tgt=-1;
  const rate=Math.abs(tgt)>Math.abs(P.thr)?7:3.5;
  P.thr+=(tgt-P.thr)*Math.min(1,dt*rate);
  if(Math.abs(P.thr)<0.01) P.thr=0;
  const now=performance.now(); const n=P.taps.filter(t=>now-t<TAP_WIN).length;
  P.dots.forEach((el,i)=>el.classList.toggle('on',i<n));
  P.paw.style.setProperty('--t',Math.max(0,P.thr).toFixed(3));
  P.paw.classList.toggle('boost',!!(r&&r.boostT>0));
}

let muted=store.get('dachshund-mute')==='1';
const audio={ctx:null,master:null,init(){
  if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}
  try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=muted?0:0.45;this.master.connect(this.ctx.destination);}catch(e){this.ctx=null;}
}};
function tone(f0,f1,dur,type='sine',vol=0.3){const A=audio.ctx;if(!A)return;const t=A.currentTime,o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g).connect(audio.master);o.start(t);o.stop(t+dur+0.02);}
const sfx={
  beep(hi){tone(hi?880:520,hi?880:520,hi?0.35:0.15,'square',0.12);},
  bark(){tone(520,260,0.12,'sawtooth',0.18);setTimeout(()=>tone(560,280,0.12,'sawtooth',0.18),150);},
  bone(){tone(990,1480,0.12,'triangle',0.2);},
  yelp(){tone(1200,300,0.35,'sawtooth',0.15);},
  jump(r){if(r.human)tone(300,620,0.12,'triangle',0.15);},
  boost(){tone(180,900,0.45,'sawtooth',0.14);setTimeout(()=>tone(260,1100,0.3,'square',0.06),80);},
  finish(){[660,880,1320].forEach((f,i)=>setTimeout(()=>tone(f,f,0.18,'triangle',0.2),i*120));},
  step(v){tone(140+v*6,90,0.05,'triangle',0.05+Math.min(v,15)*0.004);}
};

// ===== 狗狗外觀：毛色、長短毛、配件 =====
const COATS={
  red:{name:'紅棕',fur:'#a8572a',dk:'#6e3415',belly:'#d79a62'},
  blacktan:{name:'黑棕',fur:'#2b2220',dk:'#141010',belly:'#c48a52'},

const ACCS={none:'不戴',collar:'鈴鐺項圈',bow:'領結',scarf:'圍巾',glasses:'墨鏡',crown:'皇冠',hat:'派對帽',wings:'小翅膀'};
const DEFAULT_LOOKS=[{coat:'red',hair:'short',acc:'scarf',name:''},{coat:'dark',hair:'long',acc:'bow',name:''}];
function drawDog(r,X,Y,S,alpha,t){
  const L=r.look||DEFAULT_LOOKS[0], f=COATS[L.coat]||COATS.red, long=L.hair==='long';
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(X,Y); ctx.rotate(-r.a); ctx.scale(S,-S);
  ctx.lineCap='round'; ctx.lineJoin='round';
  const sp=Math.min(1,Math.hypot(r.vx,r.vy)/14), b=r.bend, boosting=r.boostT>0;
  if(boosting){ // 噴射火焰
    const fl=0.7+0.35*Math.sin(t*60)+0.25*Math.sin(t*37+1);
    ctx.fillStyle='rgba(255,106,43,.9)'; ctx.beginPath(); ctx.moveTo(-0.78,0.52); ctx.lineTo(-0.78-fl*1.1,0.36); ctx.lineTo(-0.78,0.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,220,90,.95)'; ctx.beginPath(); ctx.moveTo(-0.78,0.45); ctx.lineTo(-0.78-fl*0.6,0.36); ctx.lineTo(-0.78,0.27); ctx.closePath(); ctx.fill();
  }
  // 尾巴
  const tw=Math.sin(t*14+r.seed)*0.12;
  if(long){
    ctx.strokeStyle=f.fur; ctx.lineWidth=0.1; ctx.beginPath(); ctx.moveTo(-1.0,0.12); ctx.quadraticCurveTo(-1.25,0.25,-1.38,0.38+tw); ctx.stroke();
    ctx.lineWidth=0.06;
    for(let i=0;i<5;i++){const q=i/4, px=-1.02-q*0.34, py=0.14+q*(0.24+tw);
      ctx.beginPath(); ctx.moveTo(px,py); ctx.quadraticCurveTo(px-0.1,py-0.1,px-0.08-sp*0.1,py-0.2-0.04*Math.sin(t*12+i)); ctx.stroke();}
  } else {
    ctx.strokeStyle=f.fur; ctx.lineWidth=0.09; ctx.beginPath(); ctx.moveTo(-1.0,0.12);
    ctx.quadraticCurveTo(-1.25,0.25,-1.38,0.38+tw); ctx.stroke();
  }
  const leg=(lx,ph,col)=>{const sw=r.onGround?Math.sin(r.phase+ph)*0.16:-0.15*Math.sign(lx);
    ctx.strokeStyle=col; ctx.lineWidth=0.13; ctx.beginPath(); ctx.moveTo(lx,-0.05); ctx.lineTo(lx+sw,-0.55); ctx.stroke();
    ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(lx+sw+0.04,-0.6,0.09,0.06,0,0,7); ctx.fill();};
  leg(-0.72,Math.PI,f.dk); leg(0.62,0,f.dk);
  ctx.strokeStyle=f.fur; ctx.lineWidth=0.52; ctx.beginPath(); ctx.moveTo(-0.82,0.05); ctx.quadraticCurveTo(0,0.05+b*2,0.72,0.08); ctx.stroke();
  if(f.spots){ctx.fillStyle=f.spots; for(const [sx_,sy_,rx,ry] of [[-0.55,0.15,0.12,0.08],[-0.15,0.2+b,0.09,0.07],[0.25,0.12+b,0.13,0.08],[0.5,0.22,0.07,0.06],[-0.35,-0.02+b,0.07,0.05]]){ctx.beginPath();ctx.ellipse(sx_,sy_,rx,ry,0.3,0,7);ctx.fill();}}
  ctx.strokeStyle=f.belly; ctx.lineWidth=0.14; ctx.beginPath(); ctx.moveTo(-0.6,-0.14); ctx.quadraticCurveTo(0,-0.14+b*2,0.6,-0.12); ctx.stroke();
  if(long){ // 肚子下的長毛，跑起來會往後飄
    ctx.fillStyle=f.fur; ctx.beginPath(); ctx.moveTo(0.8,0.02);
    for(let x=0.8;x>=-0.7;x-=0.15){const yb=-0.13+b*(1-(x/0.75)**2), dr=-0.05-sp*0.1, hang=0.17+0.03*Math.sin(t*12+x*7);
      ctx.quadraticCurveTo(x-0.02+dr,yb-hang-0.06,x-0.15+dr*0.5,yb-hang*0.55);}
    ctx.lineTo(-0.82,0.0); ctx.closePath(); ctx.fill();

let mode='ai', track=TRACKS.park, race=null;

const DT=1/240;
function tick(dt){

  if(R.t<0) return;
  for(const r of R.racers){
    if(r.human){const P=players[r.pi]; r.thr=P.thr; P.air=!r.onGround; if(!P.air) P.earDown=false; if(P.jumpQ){r.jump=true;P.jumpQ=false;} if(P.boostQ){P.boostQ=false;tryBoost(r);}}

}

function openDogs(i,next){
  dogFor=i; dogNext=next;
  $('dogTitle').textContent=i===1?'玩家二：選你的臘腸狗':next==='start'?'第一步：選你的臘腸狗':mode==='duo'?'玩家一：選你的臘腸狗':'選你的臘腸狗';
  $('dogGo').textContent=next==='duo'?'下一步：選路線':next==='start'?'下一步：選比賽模式':'完成';
  $('dogBack').hidden=next==='start';
  $('dogName').value=looks[i].name||''; $('dogName').placeholder=i===1?'玩家二':'你';
  dogPrev.r=makeRacer({look:looks[i],...RIDERS[i],seed:1+i,onGround:true});
  renderDogOpts(); showOnly('dogs');
}
$('dogName').addEventListener('input',()=>{looks[dogFor].name=$('dogName').value.trim().slice(0,8);});
$('dogBack').onclick=()=>showOnly('home');
$('dogGo').onclick=()=>{
  audio.init(); store.set('dachshund-look-'+dogFor,JSON.stringify(looks[dogFor])); drawLogo();
  if(dogNext==='duo') showOnly('pick'); else showOnly('home');
};
function drawDogPreview(now){
  const c=$('dogPrev'), w=c.clientWidth||360, h=150, d=Math.min(2,devicePixelRatio||1);
  if(c.width!==Math.round(w*d)){c.width=Math.round(w*d);c.height=h*d;}
  const x=c.getContext('2d'); x.setTransform(d,0,0,d,0,0);
  const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'#bfe3f5'); g.addColorStop(1,'#f6ead2'); x.fillStyle=g; x.fillRect(0,0,w,h);
  x.fillStyle='#6fae4b'; x.fillRect(0,h-26,w,26); x.fillStyle='#4f8a35'; x.fillRect(0,h-26,w,4);
  x.fillStyle='rgba(79,138,53,.6)'; const off=(now/1000*90)%40; for(let i=-1;i<w/40+1;i++) x.fillRect(i*40-off,h-14,14,3);
  const r=dogPrev.r; r.look=looks[dogFor]; r.vx=9; r.phase=now/1000*9; r.bend=Math.sin(now/180)*0.04; r.a=0;
  const S=Math.min(46,w/5.2), prev=ctx; ctx=x; drawDog(r,w/2-0.1*S,h-26-0.66*S,S,1,now/1000); ctx=prev;
}

// ===== 主迴圈 =====
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(race&&!race.ended){
    tick(dt);
    const R=race, me=R.racers[0];
    const live=r=>r.finish==null?r.x:1e6-r.finish;
    const rankOf=r=>[1+R.racers.filter(o=>o!==r&&live(o)>live(r)).length,R.racers.length];
    const all=R.ghost?[...R.racers,R.ghost]:R.racers;
    if(mode==='duo'){
      const p2=R.racers[1];
      renderView({cx:W/2,cy:H*0.75,w:W,h:H/2,rot:0,cam:R.cams[0],others:[p2],all,rank:rankOf(me)},me,R.T,R.t);
      renderView({cx:W/2,cy:H*0.25,w:W,h:H/2,rot:Math.PI,cam:R.cams[1],others:[me],all,rank:rankOf(p2)},p2,R.T,R.t);
      ctx.fillStyle='#2b1d14'; ctx.fillRect(0,H/2-2,W,4);
    } else {
      renderView({cx:W/2,cy:H/2,w:W,h:H,rot:0,cam:R.cams[0],others:[R.ghost,...R.racers.slice(1)],all,rank:rankOf(me)},me,R.T,R.t);
    }
  } else { idleScene(); if(!$('dogs').hidden) drawDogPreview(now); }
  requestAnimationFrame(frame);
}
const idle={T:TRACKS.park,r:null,cam:{x:0,y:0}};
function idleScene(){
  if(!idle.r){idle.r=makeRacer({name:'',look:looks[0],...RIDERS[0],seed:1,ai:true,skill:0.6});placeAt(idle.r,idle.T,20);idle.cam.x=22;idle.cam.y=idle.T.h(22)+2;}
  const r=idle.r; for(let i=0;i<4;i++){aiInput(r,idle.T);stepRacer(r,idle.T,1/240,0);} if(r.x>idle.T.len-30||r.state!=='race'){placeAt(r,idle.T,20);r.state='race';}
  r.stam=1;
  renderView({cx:W/2,cy:H/2,w:W,h:H,rot:0,cam:idle.cam,others:[],all:[],rank:null,idle:true},r,idle.T,performance.now()/1000);
}
openDogs(0,'start');
requestAnimationFrame(frame);
})();
</script>
